name: Upgrade didactic calculator UX

on:
  push:
    branches: [main]
    paths:
      - 'scripts/upgrade_didactic.py'
      - '.github/workflows/upgrade-didactic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply didactic UX upgrade
        run: python scripts/upgrade_didactic.py
      - name: Commit generated changes
        run: |
          if git diff --quiet -- calculator.html ai.html; then
            echo "No generated changes to commit"
            exit 0
          fi
          git config user.name "remalab-teknoloji"
          git config user.email "kerim@remalab.com"
          git add calculator.html ai.html
          git commit -m "Make repair pricing structure didactic [skip ci]"
          git push origin main
